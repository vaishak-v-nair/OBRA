[project]
name = "orba-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=25,<26",
  "email-validator>=2,<3",
  "google-genai>=2.31.0",
  "httpx>=0.28,<1",
]
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "httpx2>=2.13.1",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
target-version = "py312"
line-length = 100
